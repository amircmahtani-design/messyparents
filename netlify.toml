# Static site — no build step. Netlify publishes the repo root and serves the functions.
[build]
  publish = "."
  command = "echo 'no build needed'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "pngjs"]
