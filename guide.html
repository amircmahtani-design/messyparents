<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide — The Messy Parents Collection</title>
<meta name="description" content="A three-minute guide from The Messy Parents Collection.">
<link rel="icon" href="assets/img/navicon.webp" type="image/webp">
<link rel="apple-touch-icon" href="assets/img/navicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="index.html"><img src="assets/img/logo.webp" alt="The Messy Parents Collection" width="620" height="270"></a>
    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="popular.html">Popular</a>
      <a href="guides.html" aria-current="page">Guides</a>
      <a href="about.html">About Us</a>
      <a href="books.html">Our Books</a>
    </nav>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav">Menu</button>
    <a class="btn-ghost" href="guides.html">Browse all</a>
  </div>
</header>

<main id="main">
  <article class="article wrap">
    <div class="article-inner" id="article"></div>
  </article>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-note">
      <span>&copy; <span id="year">2026</span> The Messy Parents Collection</span>
      <span>Written by parents, not doctors. Nothing here replaces advice from your own doctor, midwife or health visitor.</span>
    </div>
  </div>
</footer>

<script src="assets/js/guides.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>

<script>
(function(){
  const id = new URLSearchParams(location.search).get("id");
  const g = id && guideById(id);
  const el = document.getElementById("article");
  if(!g){
    document.title = "Guide not found — The Messy Parents Collection";
    el.innerHTML = `<h1>We can't find that one</h1>
      <p class="lede">The link may be old, or the guide may have been renamed.</p>
      <p style="margin-top:14px"><a href="guides.html">Browse all guides</a></p>`;
    return;
  }
  document.title = g.title + " — The Messy Parents Collection";
  const t = topicById(g.topic);
  const callout = g.callout ? `<div class="callout"><h3>${g.callout.title}</h3><ul>${
    g.callout.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>` : "";
  const rel = (g.related||[]).map(guideById).filter(Boolean);
  const relHTML = rel.length ? `<section class="related"><h2>Read next</h2>
    <div class="card-grid">${rel.map(cardHTML).join("")}</div></section>` : "";
  el.innerHTML = `
    <p class="crumb"><a href="index.html">Home</a> <span>&rsaquo;</span>
      <a href="guides.html?topic=${g.topic}">${t.label}</a> <span>&rsaquo;</span> <span>${g.title}</span></p>
    <h1>${g.title}</h1>
    <p class="article-meta">
      <span class="tag tag--topic">${t.label}</span>
      ${g.ages.map(a=>`<span class="tag">${a}</span>`).join("")}
      <span>${g.read} min read</span>
    </p>
    <div class="article-body">
      <p class="lede" style="font-size:1.12rem">${g.summary}</p>
      ${g.body}
      ${callout}
      <p style="font-size:.9rem;color:var(--ink-50);border-top:1px solid var(--line-soft);padding-top:16px;margin-top:32px">
        Written by parents, not doctors. This is general information, not medical advice &mdash;
        if something worries you about your own baby, speak to your doctor, midwife or health visitor.
        Trust your instinct: it is good data.</p>
    </div>
    ${relHTML}`;
})();
</script>
</body>
</html>
