<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide — The Messy Parents Collection</title>
<meta name="description" content="A three-minute guide from The Messy Parents Collection.">
<link rel="icon" href="assets/img/navicon.webp" type="image/webp">
<link rel="apple-touch-icon" href="assets/img/navicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* ===== Guide panel — approved visual-first template ===================== */
  .gpanel{
    --g-ink:#2b2622; --g-ink-soft:#4a423a; --g-blue:#3f6fa3;
    --g-band:#c9dced; --g-band-line:#a9c4dc; --g-rule:#cdbf9f;
    color:var(--g-ink);
    font-family:"Patrick Hand","Poppins",ui-rounded,system-ui,sans-serif;
    width:min(1180px, calc(100% - 48px));margin-inline:auto;padding:12px 0 24px;
  }
  .gpanel .g-eyebrow{
    font-family:"Nunito",sans-serif;font-weight:800;color:var(--g-blue);
    letter-spacing:.15em;font-size:14px;text-transform:uppercase;
    margin:0 0 6px;display:flex;align-items:center;gap:10px;
  }
  .gpanel .g-eyebrow img{width:24px;height:24px;object-fit:contain;display:block}
  /* Compact, article-first hero: text sets the height, illustration is capped. */
  .gpanel .g-hero{
    display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.05fr);
    column-gap:44px;align-items:center;margin:4px 0 20px;
  }
  .gpanel .g-copy{min-width:0}
  .gpanel .g-hero > *{min-width:0}
  .gpanel h1{
    font-family:"Patrick Hand","Poppins",cursive;font-weight:400;
    font-size:clamp(34px,4.6vw,58px);line-height:1;margin:10px 0 0;
    -webkit-text-stroke:.8px var(--g-ink);letter-spacing:.4px;width:100%;max-width:none;
  }
  .gpanel .g-art{
    width:100%;justify-self:end;display:flex;justify-content:center;align-items:center;
  }
  /* Illustration height is CAPPED so it never dictates page height. Presets below. */
  .gpanel .g-art img{max-width:100%;max-height:320px;width:auto;height:auto;display:block}
  .gpanel .g-art--ph{width:100%;height:320px;border-radius:14px;display:grid;place-items:center;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,#f7efdd,#e7d9bd);border:2px dashed #c3b183}
  .gpanel.g--compact .g-art img{max-height:260px}
  .gpanel.g--compact .g-art--ph{height:260px}
  .gpanel.g--visual .g-art img{max-height:380px}
  .gpanel.g--visual .g-art--ph{height:380px}
  .gpanel .g-art--ph span{font-family:"Nunito",sans-serif;font-weight:800;color:#a4926a;font-size:15px;line-height:1.5;letter-spacing:.02em}
  .gpanel .g-art--ph small{display:block;font-weight:700;font-size:12px;opacity:.85}
  .gpanel .g-cols{
    display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:6px;gap:0;
  }
  .gpanel .g-col{padding:0 26px}
  .gpanel .g-col + .g-col{border-left:2px solid var(--g-rule)}
  .gpanel .g-col:first-child{padding-left:2px}
  .gpanel .g-colhead{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
  .gpanel .g-colhead h2{font-size:24px;font-weight:400;margin:0;line-height:1.05}
  .gpanel .g-badge{flex:none;margin-top:1px}
  .gpanel .g-col ul{list-style:none;margin:0;padding:0;font-size:20px;line-height:1.45}
  .gpanel .g-col li{color:var(--g-ink-soft);margin-bottom:9px;padding-left:22px;position:relative}
  .gpanel .g-col li::before{content:"•";position:absolute;left:3px;top:-1px;color:#a08a5f;font-size:22px;line-height:1.4}
  .gpanel .g-col p{font-size:20px;line-height:1.45;color:var(--g-ink-soft);margin:0}
  .gpanel .g-bandwrap{position:relative;margin-top:18px}
  .gpanel .g-band{
    background:var(--g-band);border:2px solid var(--g-band-line);border-radius:12px;
    padding:16px 190px 16px 128px;font-size:22px;line-height:1.4;
    min-height:76px;display:flex;align-items:center;
  }
  .gpanel .g-band b{font-weight:400;-webkit-text-stroke:.5px var(--g-ink)}
  .gpanel .g-note{position:absolute;left:-4px;top:-16px;width:112px;height:92px;transform:rotate(-6deg)}
  .gpanel .g-couple{position:absolute;right:20px;bottom:-8px;width:142px}
  .gpanel .g-couple img{width:100%;border-radius:12px;display:block}
  .gpanel .g-disclaimer{
    font-family:"Nunito",sans-serif;font-size:13.5px;color:#8a7a63;
    margin:18px 2px 0;line-height:1.5;
  }
  @media (max-width:820px){
    .gpanel .g-hero{grid-template-columns:1fr;column-gap:0;gap:12px;margin-bottom:20px}
    .gpanel .g-art img{max-height:240px}
    .gpanel .g-art--ph{height:220px}
    .gpanel .g-cols{grid-template-columns:1fr;gap:20px;margin-top:8px}
    .gpanel .g-col{padding:0}
    .gpanel .g-col + .g-col{border-left:0;border-top:2px solid var(--g-rule);padding-top:18px}
    .gpanel .g-band{padding:16px 18px}
    .gpanel .g-note,.gpanel .g-couple{display:none}
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="index.html"><img src="assets/img/logo.webp" alt="The Messy Parents Collection" width="620" height="270"></a>
    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="popular.html">Popular</a>
      <a href="guides.html" aria-current="page">Guides</a>
      <a href="about.html">About Us</a>
      <a href="books.html">Our Books</a>
    </nav>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav">Menu</button>
  </div>
</header>

<main id="main">
  <div id="article"></div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-note">
      <span>&copy; <span id="year">2026</span> The Messy Parents Collection</span>
      <span>Written by parents, not doctors. Nothing here replaces advice from your own doctor, midwife or health visitor.</span>
    </div>
  </div>
</footer>

<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/guides.js"></script>
<script src="assets/js/mpc-store.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>

<script>
(function(){
  const el = document.getElementById("article");

  /* ---- Approved template (uses g.panel) ------------------------------- */
  const BADGE = {
    ok:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#3f7a2f" stroke-width="2"/><path d="M7 12.5l3.2 3.2L17 8.5" stroke="#5aa14a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    warn:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3.5l9 16H3l9-16z" stroke="#c9761f" stroke-width="2" stroke-linejoin="round" fill="#f6d9b0"/><path d="M12 9.5v4.2" stroke="#c9761f" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.15" fill="#c9761f"/></svg>`,
    tip:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 1 3.6 10.8c-.7.5-1.1 1-1.2 1.9H9.6c-.1-.9-.5-1.4-1.2-1.9A6 6 0 0 1 12 3z" fill="#fbe08a" stroke="#c9a520" stroke-width="1.6"/><path d="M9.6 18h4.8M10.2 20.4h3.6" stroke="#c9a520" stroke-width="1.8" stroke-linecap="round"/><path d="M12 1.4v1.2M4.3 5.2l.8.8M19.7 5.2l-.8.8" stroke="#d9b62a" stroke-width="1.6" stroke-linecap="round"/></svg>`
  };
  const NOTE = `<svg class="g-note" viewBox="0 0 120 98"><rect x="16" y="8" width="96" height="84" rx="6" fill="#fbf5e6" stroke="#2b2622" stroke-width="2.2"/><line x1="30" y1="4" x2="30" y2="96" stroke="#2b2622" stroke-width="2"/><g stroke="#2b2622" stroke-width="2" fill="none"><circle cx="24" cy="16" r="4"/><circle cx="24" cy="34" r="4"/><circle cx="24" cy="52" r="4"/><circle cx="24" cy="70" r="4"/><circle cx="24" cy="86" r="4"/></g><text x="42" y="42" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2622">BY ARI</text><text x="42" y="62" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2622">&amp; PAPA</text><path d="M92 74l14-8 6 12" fill="#3f6fa3" stroke="#2b2622" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

  function col(kind, block){
    if(!block) return "";
    const body = Array.isArray(block.items)
      ? `<ul>${block.items.map(i=>`<li>${i}</li>`).join("")}</ul>`
      : `<p>${block.text||""}</p>`;
    return `<div class="g-col"><div class="g-colhead"><span class="g-badge">${BADGE[kind]}</span>
      <h2>${block.title}</h2></div>${body}</div>`;
  }

  function panelMarkup(title, p, iconHTML, summaryFallback){
    p = p || {};
    const eyebrow = p.eyebrow || "";
    const layoutClass = p.layout ? " g--" + p.layout : "";   // "compact" | "visual" | (default standard)
    const bandArt = p.band || "assets/img/couple.webp";
    const heroHTML = p.hero
      ? `<div class="g-art"><img src="${p.hero}" alt="${p.heroAlt || title || ""}"></div>`
      : `<div class="g-art g-art--ph"><span>Illustration<small>generated for this guide</small></span></div>`;
    return `<div class="gpanel${layoutClass}">
      <div class="g-hero">
        <div class="g-copy">
          <p class="g-eyebrow">${iconHTML || ""}<span>${eyebrow}</span></p>
          <h1>${title || ""}</h1>
        </div>
        ${heroHTML}
      </div>
      <div class="g-cols">
        ${col("ok", p.normal)}
        ${col("warn", p.warn)}
        ${col("tip", p.helped)}
      </div>
      <div class="g-bandwrap">
        ${NOTE}
        <div class="g-band"><span><b>The quick answer:</b> ${p.quick || summaryFallback || ""}</span></div>
        <div class="g-couple"><img src="${bandArt}" alt=""></div>
      </div>
      <p class="g-disclaimer">Written by parents, not doctors. General information, not medical advice &mdash;
        if something worries you about your own baby, speak to your doctor, midwife or health visitor. Your instinct is good data.</p>
    </div>`;
  }
  /* Live-preview hook used by the Studio (same-origin iframe) — always available */
  window.__renderPreview = function(draft){
    el.className = "";
    const icon = (window.ICONS && draft && ICONS[draft.topic]) ? ICONS[draft.topic] : "";
    el.innerHTML = panelMarkup(draft && draft.title, draft && draft.panel, icon, draft && draft.summary);
  };

  /* ---- Render the real guide once the data (Firestore or bundled) is ready */
  MPCStore.ready.then(function(){
    const id = new URLSearchParams(location.search).get("id");
    const g = id && guideById(id);
    if(!g){
      document.title = "Guide not found — The Messy Parents Collection";
      el.innerHTML = `<h1>We can't find that one</h1>
        <p class="lede">The link may be old, or the guide may have been renamed.</p>
        <p style="margin-top:14px"><a href="guides.html">Browse all guides</a></p>`;
      return;
    }
    document.title = g.title + " — The Messy Parents Collection";
    const t = topicById(g.topic);

    function renderPanel(p){ el.className = ""; el.innerHTML = panelMarkup(g.title, p, iconFor(g), g.summary); }

    function renderArticle(){
      el.className = "article wrap";
      const callout = g.callout ? `<div class="callout"><h3>${g.callout.title}</h3><ul>${
        g.callout.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>` : "";
      const rel = (g.related||[]).map(guideById).filter(Boolean);
      const relHTML = rel.length ? `<section class="related"><h2>Read next</h2>
        <div class="card-grid">${rel.map(cardHTML).join("")}</div></section>` : "";
      el.innerHTML = `<div class="article-inner">
        <p class="crumb"><a href="index.html">Home</a> <span>&rsaquo;</span>
          <a href="guides.html?topic=${g.topic}">${t.label}</a> <span>&rsaquo;</span> <span>${g.title}</span></p>
        <h1>${g.title}</h1>
        <p class="article-meta">
          <span class="tag tag--topic">${t.label}</span>
          ${g.ages.map(a=>`<span class="tag">${a}</span>`).join("")}
          <span>${g.read} min read</span>
        </p>
        <div class="article-body">
          <p class="lede" style="font-size:1.12rem">${g.summary}</p>
          ${g.body}
          ${callout}
          <p style="font-size:.9rem;color:var(--ink-50);border-top:1px solid var(--line-soft);padding-top:16px;margin-top:32px">
            Written by parents, not doctors. This is general information, not medical advice &mdash;
            if something worries you about your own baby, speak to your doctor, midwife or health visitor.
            Trust your instinct: it is good data.</p>
        </div>
        ${relHTML}</div>`;
    }

    if(g.panel) renderPanel(g.panel); else renderArticle();
  });
})();
</script>
</body>
</html>
