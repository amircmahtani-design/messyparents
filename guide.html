<!-- ==========================================================================
     THIS PAGE IS ALSO THE TEMPLATE.

     The Netlify build reads this file, swaps the block between the MPC:HEAD
     markers for the guide's real title/description/canonical/schema, drops the
     rendered guide into #article, and writes the result to
     /guides/<slug>/index.html. Keeping one file means the header, the footer,
     the fonts and the script order can never drift between the page a reader
     gets and the page a crawler gets.

     The file itself stays live for two reasons: it renders unsaved drafts for
     the Studio preview (?draft=1), and it is the safety net if a build ever
     fails to write the generated pages. Requests carrying ?id= are permanently
     redirected to the clean URL by _redirects.
     ====================================================================== -->
<!-- MPC:HEAD:START -->
<title>Guide — The Messy Parents Collection</title>
<meta name="description" content="A three-minute guide from The Messy Parents Collection.">
<link rel="canonical" href="https://themessyparentscollection.com/guides.html">
<!-- The legacy/draft surface must never compete with the real guide URL. The
     build replaces this whole block with "index, follow" on generated pages. -->
<meta name="robots" content="noindex, follow">
<!-- MPC:HEAD:END -->

<!-- The three faces are served from this domain now, not from Google.

     The typography is IDENTICAL: same families, same weights, the same files
     Google was sending. Only the address changed.

     Why it changed: once the stylesheets were inlined the page painted about a
     second earlier, but the fonts still arrived on their old schedule from a
     third party. That widened the gap between "text drawn in the fallback"
     and "text drawn in the real face" from almost nothing to over a second —
     and the reflow at the end of that gap measured 0.279 CLS, most of it the
     hero headline rewrapping. Served from here and preloaded, the faces land
     with the CSS and the gap closes.

     Preloaded: the three that draw above the fold on a phone. Baloo 700 is
     the h1 and every card title, Nunito 400 is the body copy, Patrick Hand is
     the lede and every hand-lettered line. The other five load on demand.
     crossorigin is required even same-origin, because font fetches are
     CORS-mode; without it the file is fetched twice.

     (No hostnames and no angle-bracket tag names written out in here: the
     build and the test suite both regex over this HTML, and prose inside a
     comment gets matched as if it were real markup. That has bitten this file
     twice already.) -->
