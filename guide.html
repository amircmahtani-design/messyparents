<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ==========================================================================
     THIS PAGE IS ALSO THE TEMPLATE.

     The Netlify build reads this file, swaps the block between the MPC:HEAD
     markers for the guide's real title/description/canonical/schema, drops the
     rendered guide into #article, and writes the result to
     /guides/<slug>/index.html. Keeping one file means the header, the footer,
     the fonts and the script order can never drift between the page a reader
     gets and the page a crawler gets.

     The file itself stays live for two reasons: it renders unsaved drafts for
     the Studio preview (?draft=1), and it is the safety net if a build ever
     fails to write the generated pages. Requests carrying ?id= are permanently
     redirected to the clean URL by _redirects.
     ====================================================================== -->
<!-- MPC:HEAD:START -->
<title>Guide — The Messy Parents Collection</title>
<meta name="description" content="A three-minute guide from The Messy Parents Collection.">
<link rel="canonical" href="https://themessyparentscollection.com/guides.html">
<!-- The legacy/draft surface must never compete with the real guide URL. The
     build replaces this whole block with "index, follow" on generated pages. -->
<meta name="robots" content="noindex, follow">
<!-- MPC:HEAD:END -->
<link rel="icon" href="/assets/img/navicon.webp" type="image/webp">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<!-- Home-screen icon: a fully opaque, square PNG. Transparent or non-square
     icons get padded with white by iOS, which is what caused the white edges. -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Messy Parents">
<meta name="theme-color" content="#fbf0d3">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Guide illustrations are served from Firebase Storage; opening the
     connection early saves the handshake when the first one is needed. -->
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/style.css?v=11">
<!-- The guide panel's own CSS. Was ~5KB inline in this file; now a shared,
     hard-cached stylesheet so 300 generated pages do not each carry a copy. -->
<link rel="stylesheet" href="/assets/css/guide.css?v=2">
</head>
<body data-mpc-page="guide">
<a class="skip" href="#main" data-mpc-text="skip">Skip to content</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="/index.html"><img src="/assets/img/logo.webp" alt="The Messy Parents Collection" width="620" height="270" fetchpriority="high" decoding="async"></a>
    <nav class="nav" id="nav">
      <a href="/index.html" data-mpc-text="nav.home">Home</a>
      <a href="/popular.html" data-mpc-text="nav.popular">Popular</a>
      <a href="/guides.html" aria-current="page" data-mpc-text="nav.guides">Guides</a>
      <a href="/about.html" data-mpc-text="nav.about">About Us</a>
      <a href="/books.html" data-mpc-text="nav.books">Our Books</a>
    </nav>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav" data-mpc-text="nav.toggle">Menu</button>
  </div>
</header>

<main id="main">
  <!-- MPC:CRUMB:START --><!-- MPC:CRUMB:END -->
  <div id="article"></div>
  <!-- MPC:EXTRA:START --><!-- MPC:EXTRA:END -->
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-note">
      <!-- Both lines are editable in Studio (Site → Footer). The wording here
           is what shows if nothing has been saved. -->
      <span data-foot-copy>&copy; <span id="year">2026</span> The Messy Parents Collection</span>
      <span data-foot-note>Written by parents, not doctors. Nothing here replaces advice from your own doctor, midwife or health visitor.</span>
      <span class="foot-links"><a href="/about.html">About us</a><a href="/editorial.html">How we write these</a></span>
    </div>
  </div>
</footer>

<script src="/assets/js/firebase-config.js"></script>
<script src="/assets/js/guides.js?v=10"></script>
<script src="/assets/js/guide-render.js?v=1"></script>
<script src="/assets/js/mpc-store.js?v=10"></script>
<script>/* The Studio-edited copyright line writes its own year, so this span
   may already be gone by the time this runs. */
var _y=document.getElementById("year"); if(_y) _y.textContent=new Date().getFullYear();</script>
<script src="/assets/js/guide-page.js?v=1"></script>
</body>
</html>
