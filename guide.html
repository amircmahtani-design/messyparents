<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide — The Messy Parents Collection</title>
<meta name="description" content="A three-minute guide from The Messy Parents Collection.">
<link rel="icon" href="assets/img/navicon.webp" type="image/webp">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<!-- Home-screen icon: a fully opaque, square PNG. Transparent or non-square
     icons get padded with white by iOS, which is what caused the white edges. -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Messy Parents">
<meta name="theme-color" content="#fbf0d3">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/style.css?v=11">
<style>
  /* Align the shared header with the guide's 1180px container on this page,
     so logo/nav/hero/columns/quick-answer all share one centred width. */
  .site-head .wrap{--wrap:1180px}
  /* ===== Guide panel — approved visual-first template ===================== */
  .gpanel{
    /* These used to be their own hex values and had drifted from the rest of
       the site. They now point at tokens.css, so the guide, the book and the
       website are literally the same colours. */
    --g-ink:var(--ink-hand); --g-ink-soft:var(--ink-hand-soft); --g-blue:var(--blue-ink);
    --g-band:var(--blue-band); --g-band-line:var(--blue-band-line); --g-rule:var(--rule-hand);
    color:var(--g-ink);
    font-family:var(--hand);
    width:min(1180px, calc(100% - 48px));margin-inline:auto;padding:12px 0 24px;
  }
  .gpanel .g-eyebrow{
    font-family:"Nunito",sans-serif;font-weight:800;color:var(--g-blue);
    letter-spacing:.15em;font-size:14px;text-transform:uppercase;
    margin:0 0 6px;display:flex;align-items:center;gap:10px;
  }
  .gpanel .g-eyebrow img{width:24px;height:24px;object-fit:contain;display:block}
  /* Compact, article-first hero: text sets the height, illustration is capped. */
  .gpanel .g-hero{
    display:grid;grid-template-columns:minmax(0,0.86fr) minmax(0,1.14fr);
    column-gap:20px;align-items:center;margin:12px 0 20px;
  }
  .gpanel .g-copy{min-width:0}
  .gpanel .g-hero > *{min-width:0}
  .gpanel h1{
    font-family:var(--hand);font-weight:400;
    font-size:clamp(34px,4.6vw,58px);line-height:1.02;margin:8px 0 0;
    -webkit-text-stroke:var(--stroke-title) var(--g-ink);letter-spacing:.4px;width:100%;max-width:none;
  }
  /* Illustration sits centred in its column (balanced whitespace), nudged
     slightly left — NOT jammed against the far-right edge. */
  .gpanel .g-art{
    width:100%;display:flex;justify-content:flex-start;align-items:center;
  }
  /* Illustration is pulled left toward the title (fills the empty gap) and
     capped in height so it never dictates page height. Presets below. */
  .gpanel .g-art img{max-width:530px;width:100%;max-height:285px;height:auto;
    object-fit:contain;display:block;transform:translateX(-40px)}
  .gpanel .g-art--ph{width:100%;max-width:530px;height:285px;border-radius:14px;display:grid;place-items:center;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,#f7efdd,#e7d9bd);border:2px dashed #c3b183;transform:translateX(-40px)}
  .gpanel.g--compact .g-art img{max-height:270px}
  .gpanel.g--compact .g-art--ph{height:270px}
  .gpanel.g--visual .g-art img{max-height:340px}
  .gpanel.g--visual .g-art--ph{height:340px}
  .gpanel .g-art--ph span{font-family:"Nunito",sans-serif;font-weight:800;color:#a4926a;font-size:15px;line-height:1.5;letter-spacing:.02em}
  .gpanel .g-art--ph small{display:block;font-weight:700;font-size:12px;opacity:.85}
  .gpanel .g-cols{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0;gap:0;
  }
  .gpanel .g-col{padding:0 36px}
  .gpanel .g-col + .g-col{border-left:1px solid rgba(80,60,35,.25)}
  .gpanel .g-col:first-child{padding-left:0}
  .gpanel .g-col:last-child{padding-right:0}
  .gpanel .g-colhead{display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
  .gpanel .g-colhead h2{font-size:24px;font-weight:400;margin:0;line-height:1.05}
  .gpanel .g-badge{flex:none;margin-top:1px}
  .gpanel .g-col ul{list-style:none;margin:0;padding:0;font-size:20px;line-height:1.45}
  .gpanel .g-col li{color:var(--g-ink-soft);margin-bottom:9px;padding-left:22px;position:relative}
  .gpanel .g-col li::before{content:"•";position:absolute;left:3px;top:-1px;color:#a08a5f;font-size:22px;line-height:1.4}
  .gpanel .g-col p{font-size:20px;line-height:1.45;color:var(--g-ink-soft);margin:0}
  .gpanel .g-bandwrap{margin-top:16px}
  .gpanel .g-band{
    position:relative;overflow:visible;
    display:grid;grid-template-columns:auto 1fr;align-items:center;gap:22px;
    background:var(--g-band);border:2px solid var(--g-band-line);border-radius:14px;
    padding:13px 210px 13px 26px;min-height:80px;font-size:22px;line-height:1.4;
  }
  .gpanel .g-band b{font-weight:400;-webkit-text-stroke:.5px var(--g-ink)}
  .gpanel .g-band-text{min-width:0}
  .gpanel .g-note{width:108px;height:90px;transform:rotate(-6deg);display:block;flex:none}
  .gpanel .g-note--img{object-fit:contain}
  /* Ari & Papa hug pops UP out of the blue box (anchored to the bottom, taller
     than the band so their heads break the top edge). */
  .gpanel .g-couple{position:absolute;right:26px;bottom:-2px;width:184px}
  .gpanel .g-couple img{width:100%;display:block}
  /* Tablet: keep two-column hero, trim the image and gaps. */
  @media (max-width:1024px) and (min-width:821px){
    .gpanel .g-hero{column-gap:32px;margin:16px 0 22px}
    .gpanel .g-art img{max-width:460px;max-height:300px;transform:none}
    .gpanel .g-art--ph{max-width:460px;height:300px;transform:none}
    .gpanel .g-col{padding:0 22px}
  }
  /* Mobile: stack everything, image below title, no dividers. */
  @media (max-width:820px){
    .gpanel .g-hero{grid-template-columns:1fr;column-gap:0;gap:12px;margin:14px 0 18px}
    .gpanel .g-art img{max-width:100%;max-height:260px;transform:none;margin-inline:auto}
    .gpanel .g-art--ph{max-width:100%;height:220px;transform:none}
    .gpanel .g-cols{grid-template-columns:1fr;gap:20px;margin-top:8px}
    .gpanel .g-col{padding:0}
    .gpanel .g-col + .g-col{border-left:0;border-top:1px solid rgba(80,60,35,.25);padding-top:18px}
    .gpanel .g-band{grid-template-columns:1fr;gap:12px;justify-items:center;text-align:center;padding:16px 18px;min-height:0}
    .gpanel .g-note{display:none}
    .gpanel .g-couple{position:static;width:120px;margin:0 auto}
  }
</style>
</head>
<body data-mpc-page="guide">
<a class="skip" href="#main" data-mpc-text="skip">Skip to content</a>

<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="index.html"><img src="assets/img/logo.webp" alt="The Messy Parents Collection" width="620" height="270"></a>
    <nav class="nav" id="nav">
      <a href="index.html" data-mpc-text="nav.home">Home</a>
      <a href="popular.html" data-mpc-text="nav.popular">Popular</a>
      <a href="guides.html" aria-current="page" data-mpc-text="nav.guides">Guides</a>
      <a href="about.html" data-mpc-text="nav.about">About Us</a>
      <a href="books.html" data-mpc-text="nav.books">Our Books</a>
    </nav>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav" data-mpc-text="nav.toggle">Menu</button>
  </div>
</header>

<main id="main">
  <div id="article"></div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-note">
      <!-- Both lines are editable in Studio (Site → Footer). The wording here
           is what shows if nothing has been saved. -->
      <span data-foot-copy>&copy; <span id="year">2026</span> The Messy Parents Collection</span>
      <span data-foot-note>Written by parents, not doctors. Nothing here replaces advice from your own doctor, midwife or health visitor.</span>
    </div>
  </div>
</footer>

<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/guides.js?v=9"></script>
<script src="assets/js/mpc-store.js?v=10"></script>
<script>/* The Studio-edited copyright line writes its own year, so this span
   may already be gone by the time this runs. */
var _y=document.getElementById("year"); if(_y) _y.textContent=new Date().getFullYear();</script>

<script>
(function(){
  const el = document.getElementById("article");

  /* ---- Fit-to-screen ---------------------------------------------------
     Instead of hand-tuning pixels, measure the real guide and scale it so
     the whole thing (header + guide) fits the viewport on any screen.
     Only runs on the actual page — never inside the Studio preview iframe. */
  const IS_TOP = (function(){ try{ return window.top === window.self; }catch(e){ return true; } })();
  function fitGuide(){
    if(!IS_TOP) return;
    const panel = el.querySelector(".gpanel");
    if(!panel){ el.style.height = ""; return; }
    panel.style.transformOrigin = "top center";
    panel.style.transform = "";
    el.style.height = "";
    const header = document.querySelector(".site-head");
    const headH = header ? header.getBoundingClientRect().height : 0;
    const avail = window.innerHeight - headH - 16;          // small breathing room
    const natural = panel.scrollHeight;
    if(natural > avail && avail > 0){
      const scale = avail / natural;
      if(scale >= 0.8){                                        // gentle fit — never shrink past ~20%
        panel.style.transform = "scale(" + scale + ")";
        el.style.height = Math.ceil(natural * scale) + "px";
      }
      // if it would shrink more than ~18%, leave full size and let the page
      // scroll a little instead of making everything tiny.
    }
  }
  function scheduleFit(){
    fitGuide();
    requestAnimationFrame(fitGuide);
    setTimeout(fitGuide, 150);
    setTimeout(fitGuide, 450);
  }
  window.addEventListener("resize", fitGuide);
  window.addEventListener("orientationchange", scheduleFit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitGuide);

  /* ---- Approved template (uses g.panel) ------------------------------- */
  const BADGE = {
    ok:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#3f7a2f" stroke-width="2"/><path d="M7 12.5l3.2 3.2L17 8.5" stroke="#5aa14a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    warn:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3.5l9 16H3l9-16z" stroke="#c9761f" stroke-width="2" stroke-linejoin="round" fill="#f6d9b0"/><path d="M12 9.5v4.2" stroke="#c9761f" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.15" fill="#c9761f"/></svg>`,
    tip:`<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 0 1 3.6 10.8c-.7.5-1.1 1-1.2 1.9H9.6c-.1-.9-.5-1.4-1.2-1.9A6 6 0 0 1 12 3z" fill="#fbe08a" stroke="#c9a520" stroke-width="1.6"/><path d="M9.6 18h4.8M10.2 20.4h3.6" stroke="#c9a520" stroke-width="1.8" stroke-linecap="round"/><path d="M12 1.4v1.2M4.3 5.2l.8.8M19.7 5.2l-.8.8" stroke="#d9b62a" stroke-width="1.6" stroke-linecap="round"/></svg>`
  };
  /* The notepad badge beside the quick answer. Its two lines are editable in
     Studio (Guide layout), and the whole badge can be replaced with an
     uploaded picture (Guide layout → Notepad badge). */
  function noteMarkup(){
    const custom = MPCStore.t("note.image", "");
    if(custom) return `<img class="g-note g-note--img" src="${MPCStore.esc(custom)}" alt="">`;
    const l1 = MPCStore.esc(MPCStore.t("note.line1", "BY ARI"));
    const l2 = MPCStore.esc(MPCStore.t("note.line2", "& PAPA"));
    return `<svg class="g-note" viewBox="0 0 120 98"><rect x="16" y="8" width="96" height="84" rx="6" fill="#fbf5e6" stroke="#2b2622" stroke-width="2.2"/><line x1="30" y1="4" x2="30" y2="96" stroke="#2b2622" stroke-width="2"/><g stroke="#2b2622" stroke-width="2" fill="none"><circle cx="24" cy="16" r="4"/><circle cx="24" cy="34" r="4"/><circle cx="24" cy="52" r="4"/><circle cx="24" cy="70" r="4"/><circle cx="24" cy="86" r="4"/></g><text x="42" y="42" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2622">${l1}</text><text x="42" y="62" font-family="Patrick Hand, cursive" font-size="16" fill="#2b2622">${l2}</text><path d="M92 74l14-8 6 12" fill="#3f6fa3" stroke="#2b2622" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  }

  function col(kind, block){
    if(!block) return "";
    const body = Array.isArray(block.items)
      ? `<ul>${block.items.map(i=>`<li>${i}</li>`).join("")}</ul>`
      : `<p>${block.text||""}</p>`;
    return `<div class="g-col"><div class="g-colhead"><span class="g-badge">${BADGE[kind]}</span>
      <h2>${block.title}</h2></div>${body}</div>`;
  }

  function panelMarkup(title, p, iconHTML, summaryFallback){
    p = p || {};
    const eyebrow = p.eyebrow || "";
    const layoutClass = p.layout ? " g--" + p.layout : "";   // "compact" | "visual" | (default standard)
    const bandArt = p.band || MPCStore.t("band.image", "") || "assets/img/couple.webp";
    const heroHTML = p.hero
      ? `<div class="g-art"><img src="${p.hero}" alt="${p.heroAlt || title || ""}"></div>`
      : `<div class="g-art g-art--ph"><span>Illustration<small>generated for this guide</small></span></div>`;
    return `<div class="gpanel${layoutClass}">
      <div class="g-hero">
        <div class="g-copy">
          <p class="g-eyebrow">${iconHTML || ""}<span>${eyebrow}</span></p>
          <h1>${title || ""}</h1>
        </div>
        ${heroHTML}
      </div>
      <div class="g-cols">
        ${col("ok", p.normal)}
        ${col("warn", p.warn)}
        ${col("tip", p.helped)}
      </div>
      <div class="g-bandwrap">
        <div class="g-band">
          ${noteMarkup()}
          <div class="g-band-text"><b>${MPCStore.esc(MPCStore.t("quick.label", "The quick answer:"))}</b> ${p.quick || summaryFallback || ""}</div>
          <div class="g-couple"><img src="${bandArt}" alt=""></div>
        </div>
      </div>
    </div>`;
  }
  /* Live-preview hook used by the Studio (same-origin iframe) — always available */
  window.__renderPreview = function(draft){
    el.className = "";
    const icon = (window.ICONS && draft && ICONS[draft.topic]) ? ICONS[draft.topic] : "";
    el.innerHTML = panelMarkup(draft && draft.title, draft && draft.panel, icon, draft && draft.summary);
  };

  /* ---- Render the real guide once the data (Firestore or bundled) is ready */
  MPCStore.ready.then(function(){
    const params = new URLSearchParams(location.search);
    // Studio "new guide" preview: leave whatever __renderPreview drew.
    if(params.get("draft")) return;
    const id = params.get("id");
    const g = id && guideById(id);
    if(!g){
      document.title = "Guide not found — The Messy Parents Collection";
      el.innerHTML = `<h1>We can't find that one</h1>
        <p class="lede">The link may be old, or the guide may have been renamed.</p>
        <p style="margin-top:14px"><a href="guides.html">Browse all guides</a></p>`;
      return;
    }
    document.title = g.title + " — The Messy Parents Collection";
    const t = topicById(g.topic);

    function renderPanel(p){
      el.className = ""; el.innerHTML = panelMarkup(g.title, p, iconFor(g), g.summary);
      el.querySelectorAll("img").forEach(im => { if(!im.complete) im.addEventListener("load", fitGuide, {once:true}); });
      scheduleFit();
    }

    function renderArticle(){
      el.className = "article wrap";
      const callout = g.callout ? `<div class="callout"><h3>${g.callout.title}</h3><ul>${
        g.callout.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>` : "";
      const rel = (g.related||[]).map(guideById).filter(Boolean);
      const relHTML = rel.length ? `<section class="related"><h2>Read next</h2>
        <div class="card-grid">${rel.map(cardHTML).join("")}</div></section>` : "";
      el.innerHTML = `<div class="article-inner">
        <p class="crumb"><a href="index.html" data-mpc-text="nav.home">Home</a> <span>&rsaquo;</span>
          <a href="guides.html?topic=${g.topic}">${t.label}</a> <span>&rsaquo;</span> <span>${g.title}</span></p>
        <h1>${g.title}</h1>
        <p class="article-meta">
          <span class="tag tag--topic">${t.label}</span>
          ${g.ages.map(a=>`<span class="tag">${a}</span>`).join("")}
          <span>${g.read} min read</span>
        </p>
        <div class="article-body">
          <p class="lede" style="font-size:1.12rem">${g.summary}</p>
          ${g.body}
          ${callout}
        </div>
        ${relHTML}</div>`;
    }

    const draw = () => { if(g.panel) renderPanel(g.panel); else renderArticle(); };
    draw();
    // Studio edits to the guide layout wording redraw the guide immediately.
    window.addEventListener("mpc:textchange", draw);
  });
})();
</script>
</body>
</html>
